name: Test Unity Bridge Skill

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'

    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black==24.4.2 flake8==7.0.0

    - name: Check formatting with black
      run: |
        black --check --line-length=100 skill/src skill/tests

    - name: Lint with flake8
      run: |
        flake8 --max-line-length=100 --extend-ignore=E203 skill/src skill/tests

  test:
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
      fail-fast: false

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e "./skill[dev]"

    - name: Run tests
      run: |
        cd skill
        pytest tests/test_cli.py -v --cov=src/claude_unity_bridge --cov-report=term-missing --cov-report=xml

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: skill/coverage.xml
        flags: python-skill
        name: python-skill-coverage
        fail_ci_if_error: false
        verbose: true

    - name: Test CLI help
      run: |
        unity-bridge --help

    - name: Test CLI syntax
      run: |
        python -m py_compile skill/src/claude_unity_bridge/cli.py
